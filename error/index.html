<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ouch — Andreas Music Hub</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#050505;color:#fff}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:999px;filter:blur(90px);opacity:.22;animation:float 12s ease-in-out infinite alternate}
.orb.a{width:430px;height:430px;background:#ff5a00;left:-180px;top:10%}
.orb.b{width:360px;height:360px;background:#ff8b2b;right:-140px;bottom:0;animation-delay:-5s}
@keyframes float{to{transform:translate3d(35px,-30px,0) scale(1.08)}}
.card{position:relative;width:min(720px,calc(100% - 40px));padding:56px 42px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:rgba(18,18,18,.58);box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
h1{margin:0;font-size:clamp(42px,7vw,76px);line-height:1.02;letter-spacing:-.045em}
p{margin:22px auto 30px;max-width:560px;color:rgba(255,255,255,.68);font-size:17px;line-height:1.6}
a{display:inline-flex;align-items:center;justify-content:center;padding:15px 25px;border-radius:15px;background:#ff5a00;color:#fff;text-decoration:none;font-weight:750;box-shadow:0 12px 30px rgba(255,90,0,.25);transition:transform .2s,filter .2s}
a:hover{transform:translateY(-2px);filter:brightness(1.08)}
</style>
</head>
<body>
<div class="bg"><div class="orb a"></div><div class="orb b"></div></div>
<main class="card">
<h1>Ouch, we didn't find that at our place, apparently.</h1>
<p>The page you're looking for doesn't seem to exist here.</p>
<a href="/">Go to the main site</a>
</main>
</body>
</html>
